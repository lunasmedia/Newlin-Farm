name: Plugins Publish

"on":
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install deps
        run: npm ci
      - name: Build plugins
        run: npm run build:plugins
      - name: Run plugin tests
        run: npm run test:plugins
      - name: Publish plugins (simulated)
        run: npm run publish:plugins
